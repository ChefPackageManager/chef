[project]
name = "chef"
description = "Security-focused utility for installing software for macOS & Linux."

dynamic = ["version"]

authors = [
    { name = "Axel H. Karlsson", email = "git@axelkarlsson.se" }
]

requires-python = ">= 3.9"

dependencies = [
    "build>=1.4.4"
]

[project.scripts]
chef = "chef:main.main"

[build-system]
requires = ["setuptools >= 82.0.1"]
build-backend = "setuptools.build_meta"